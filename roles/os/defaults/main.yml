---
# Installed, never removed. unattended-upgrades is installed regardless.
os_apt_packages:
  - apt-listchanges
  - ca-certificates
  - curl
  - gnupg
  - jq
  - python3
  - python3-pip
  - python3-debian # ansible.builtin.deb822_repository (docker, caddy)
  - sqlite3
  - ufw

# Boards only: reach the board as <hostname>.local.
os_board_packages:
  - avahi-daemon

# Name the box in a zone YOU own — never a client's or the provider's. Set
# fleet-wide, and the box becomes <inventory key>.<domain>.
os_hostname_domain: ""

# Per-host override of that derivation. Both empty: the box is not renamed,
# which keeps an FQDN the provider already set.
os_hostname: ""

# Opt-in swapfile. Worth it on a small VM, where apt can OOM without it; not on
# a board, where it wears the card.
os_swap_enabled: false
os_swap_file: /swapfile
os_swap_size: 1G
os_swap_swappiness: 10
os_swap_vfs_cache_pressure: 50

# IANA name. os_unattended_reboot_time is read in this zone. This default is one
# region's; set it fleet-wide.
os_timezone: America/Sao_Paulo

# 3600 skips an apt-update on re-runs within the hour.
os_apt_cache_valid_time: 3600

# unattended-upgrades is the only upgrader and rebooter; playbooks/update.yml is
# the explicit catch-up. Extra Origins-Pattern entries for repos beyond the
# distribution's own, e.g. "origin=Armbian,codename=${distro_codename}".
os_unattended_origins: []

# Local time for a reboot an upgrade requires. The minute is seeded per host so
# a fleet never reboots at once and the render stays stable; 60 slots is
# spread, not uniqueness. Asserted HH:MM.
os_unattended_reboot_hour: "03"
os_unattended_reboot_time: "{{ os_unattended_reboot_hour }}:{{ '%02d' | format(59 | random(seed=inventory_hostname)) }}"

# NTP servers for systemd-timesyncd. Empty removes ours and the image default
# stands. Skipped where timesyncd is absent.
os_ntp_servers: []
