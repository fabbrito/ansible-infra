---
# --- Hostname: name the box <inventory key>.<domain> (FQDN) ---
# Opt-in, and the whole block is skipped when neither var is set: naming the box
# after the inventory key alone would RENAME a host that already carries an
# FQDN, on a converge that reports green. Order-independent otherwise — nothing
# else in the baseline reads the live hostname.
- name: Name the box
  when: os_hostname | length > 0 or os_hostname_domain | length > 0
  tags: [hostname]
  block:
    - name: Resolve the target hostname
      ansible.builtin.set_fact:
        os_hostname_target: >-
          {{ os_hostname if os_hostname | length > 0
             else inventory_hostname ~ '.' ~ os_hostname_domain }}

    - name: Set system hostname
      ansible.builtin.hostname:
        name: "{{ os_hostname_target }}"

    # The hostname module does NOT touch /etc/hosts. The live hostname must map
    # to a loopback IP here or `sudo` warns "unable to resolve host" (glibc
    # reads /etc/hosts before DNS). The regexp is anchored to the resolved name,
    # so this adds a line and never rewrites the 127.0.1.1 entry the cloud image
    # already ships — that one usually resolves in the provider's public DNS and
    # is worth keeping.
    - name: Add the FQDN to /etc/hosts on 127.0.1.1
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s+{{ os_hostname_target | regex_escape }}\b'
        insertafter: '^127\.0\.1\.1\s'
        line: "127.0.1.1 {{ os_hostname_target }} {{ inventory_hostname }}"
        state: present

# --- Swap FIRST (>= 1G; tiny VPS without it OOMs during the apt run that follows) ---
- name: Stat swapfile
  ansible.builtin.stat:
    path: "{{ os_swap_file }}"
  register: os_swap_stat
  when: os_swap_enabled
  tags: [swap]

# Gate Format + Enable on active-in-/proc/swaps, not file existence: a run that
# allocated the file but died before mkswap leaves it on disk, and existence
# gating would then skip Format/Enable until someone deletes it by hand.
- name: Check if swapfile is active in /proc/swaps
  ansible.builtin.command: "grep -q '^{{ os_swap_file }} ' /proc/swaps"
  register: os_swap_active
  changed_when: false
  failed_when: false
  check_mode: false
  when: os_swap_enabled
  tags: [swap]

- name: Allocate swapfile
  ansible.builtin.command: "fallocate -l {{ os_swap_size }} {{ os_swap_file }}"
  args:
    creates: "{{ os_swap_file }}"
  when: os_swap_enabled
  tags: [swap]

- name: Secure swapfile permissions
  ansible.builtin.file:
    path: "{{ os_swap_file }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - os_swap_enabled
    - os_swap_stat.stat.exists or not ansible_check_mode
  tags: [swap]

- name: Format swapfile
  ansible.builtin.command: "mkswap {{ os_swap_file }}"
  when:
    - os_swap_enabled
    - os_swap_active.rc | default(1) != 0
  changed_when: true
  tags: [swap]

- name: Enable swap (runtime)
  ansible.builtin.command: "swapon {{ os_swap_file }}"
  when:
    - os_swap_enabled
    - os_swap_active.rc | default(1) != 0
  changed_when: true
  tags: [swap]

- name: Persist swap in /etc/fstab
  ansible.posix.mount:
    path: none
    src: "{{ os_swap_file }}"
    fstype: swap
    opts: sw
    state: present
  when:
    - os_swap_enabled
    - os_swap_stat.stat.exists or not ansible_check_mode
  tags: [swap]

- name: Tune vm.swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ os_swap_swappiness }}"
    state: present
    sysctl_set: true
    reload: true
  when:
    - os_swap_enabled
    - os_swap_stat.stat.exists or not ansible_check_mode
  tags: [swap]

- name: Tune vm.vfs_cache_pressure
  ansible.posix.sysctl:
    name: vm.vfs_cache_pressure
    value: "{{ os_swap_vfs_cache_pressure }}"
    state: present
    sysctl_set: true
    reload: true
  when:
    - os_swap_enabled
    - os_swap_stat.stat.exists or not ansible_check_mode
  tags: [swap]

# --- Full apt upgrade FIRST so the base layer lands on a current system ---
# Otherwise Docker/Caddy land beside deps superseded minutes later. Costs 2-5
# min on a fresh image.
- name: Apt update + dist-upgrade + autoremove
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    autoremove: true
    autoclean: true
    cache_valid_time: "{{ os_apt_cache_valid_time }}"
  tags: [apt-upgrade]

- name: Check if reboot is required (kernel/libc updates)
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: os_reboot_required
  tags: [apt-upgrade]

- name: Reboot if needed
  ansible.builtin.reboot:
    msg: "Reboot triggered by bootstrap apt-upgrade"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 5
    post_reboot_delay: 30
    test_command: uptime
  when: os_reboot_required.stat.exists
  tags: [apt-upgrade]

# --- Apt base packages (relies on swap headroom on tiny VPS) ---
- name: Apt base packages
  ansible.builtin.apt:
    name: "{{ os_apt_packages }}"
    state: present
    update_cache: false # already refreshed above
  tags: [apt]

# --- Timezone ---
- name: Set system timezone
  community.general.timezone:
    name: "{{ os_timezone }}"
  tags: [timezone]

# --- Unattended security upgrades (config-only — needs unattended-upgrades from apt step) ---
- name: Enable unattended-upgrades (apt periodic)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
  tags: [upgrades]

- name: Configure unattended-upgrades policy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: "0644"
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ os_unattended_reboot_time }}";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
  tags: [upgrades]
