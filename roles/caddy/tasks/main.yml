---
- name: Resolve the effective route list
  ansible.builtin.include_tasks: routes.yml

- name: Assert every route is complete
  ansible.builtin.assert:
    that:
      - item.tls is defined
      - item.tls in ['acme', 'cert']
      - item.default_upstream is defined or item.redirect_to is defined
      - item.proxied_by is not defined or item.proxied_by in caddy_proxy_ranges
    fail_msg: >-
      Route {{ item.host }} needs `tls: acme` or `tls: cert`, a
      default_upstream or redirect_to, and a proxied_by (if any) naming a key of
      caddy_proxy_ranges.
    quiet: true
  loop: "{{ caddy_all_routes }}"
  loop_control:
    label: "{{ item.host }}"
  # `tls` has no default: either guess breaks the other mode's hosts.

- name: Assert an ACME account email is set when any route uses ACME
  ansible.builtin.assert:
    that:
      - caddy_acme_email is defined
      - caddy_acme_email | length > 0
    fail_msg: >-
      Routes use `tls: acme` but caddy_acme_email is unset. Set it fleet-wide;
      it is an address, not a credential, so it needs no vault.
    quiet: true
  when: caddy_all_routes | selectattr('tls', 'equalto', 'acme') | list | length > 0
  # Absent, the issuer chain silently loses ZeroSSL (ADR-0006).

# Otherwise `caddy validate` fails mid-role, naming a path, not the var.
- name: Name the origin certs this host has both halves of
  ansible.builtin.set_fact:
    caddy_available_certs: >-
      {{ caddy_origin_certs
         | selectattr('cert', 'defined') | selectattr('cert')
         | selectattr('key', 'defined') | selectattr('key')
         | map(attribute='name') | list }}

- name: Assert every cert-mode route has its origin cert and key
  ansible.builtin.assert:
    that: item.cert | default('default') in caddy_available_certs
    fail_msg: >-
      Route {{ item.host }} uses `tls: cert` with cert
      "{{ item.cert | default('default') }}", but that cert or its key is unset.
      Set caddy_origin_cert + caddy_origin_key for "default", or a
      caddy_extra_certs entry with both cert and key.
    quiet: true
  loop: "{{ caddy_all_routes | selectattr('tls', 'equalto', 'cert') | list }}"
  loop_control:
    label: "{{ item.host }}"

- name: Assert at most one proxy provider fronts this host
  ansible.builtin.assert:
    that:
      - caddy_all_routes | selectattr('proxied_by', 'defined')
        | map(attribute='proxied_by') | unique | list | length <= 1
    fail_msg: >-
      Routes name more than one `proxied_by` provider. Trust is server-level in
      Caddy and every vhost shares :443, so one host can trust one provider.
    quiet: true
  # Ranges could union; client_ip_headers cannot.

# Unassertable here: `upstreams[].paths` must be literal (defaults/main.yml).
- name: Caddy apt key
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://dl.cloudsmith.io/public/caddy/stable/gpg.key \
      | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
    executable: /bin/bash

# Left by the old apt_repository task; beside caddy.sources it duplicates the repo.
- name: Remove legacy Caddy apt .list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/caddy.list
    state: absent

- name: Caddy apt repo
  ansible.builtin.deb822_repository:
    name: caddy
    types: deb
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: any-version
    components: main
    signed_by: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
    state: present

# Upstream apt package (ADR-0004). Never `caddy upgrade`: the next apt upgrade
# of caddy clobbers the self-replaced binary. Standard modules only.
# The package starts the unit; the service task only undoes a hand-disable.
- name: Install caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Ensure certs dir
  ansible.builtin.file:
    path: "{{ caddy_certs_dir }}"
    state: directory
    owner: root
    group: caddy
    mode: "0750"

- name: Drop origin certificates
  ansible.builtin.copy:
    dest: "{{ caddy_certs_dir }}/{{ item.name }}.pem"
    content: "{{ item.cert }}"
    owner: root
    group: caddy
    mode: "0640"
  loop: "{{ caddy_origin_certs }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.cert | default('') | length > 0
  notify: Reload caddy

- name: Drop origin private keys
  ansible.builtin.copy:
    dest: "{{ caddy_certs_dir }}/{{ item.name }}.key"
    content: "{{ item.key }}"
    owner: root
    group: caddy
    mode: "0640"
  loop: "{{ caddy_origin_certs }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.key | default('') | length > 0
  no_log: true
  notify: Reload caddy

# `validate:` below runs as root and creates missing log files root-owned;
# caddy then cannot write them and reloads time out forever.
- name: Ensure per-vhost access log files exist (caddy-owned)
  ansible.builtin.file:
    path: "/var/log/caddy/{{ item.host }}.log"
    state: touch
    owner: caddy
    group: caddy
    mode: "0640"
    access_time: preserve
    modification_time: preserve
  loop: "{{ caddy_all_routes }}"
  loop_control:
    label: "{{ item.host }}"
  changed_when: false

- name: Render Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0644"
    validate: "caddy validate --config %s --adapter caddyfile"
  notify: Reload caddy

- name: Ensure caddy is enabled and running
  ansible.builtin.service:
    name: caddy
    state: started
    enabled: true
  when: not ansible_check_mode

# A config that loads but cannot bind leaves caddy active, serving nothing.
# Handlers first, so the probe sees this run's config.
- name: Apply the pending caddy reload
  ansible.builtin.meta: flush_handlers

- name: Probe the HTTPS listener
  ansible.builtin.command: ss -Hltn 'sport = :443'
  register: caddy_https_listener
  changed_when: false
  check_mode: false
  when: caddy_all_routes | rejectattr('host', 'match', 'http://') | list | length > 0

- name: Assert caddy listens on :443
  ansible.builtin.assert:
    that: caddy_https_listener.stdout | length > 0
    fail_msg: >-
      Routes need HTTPS but nothing listens on :443. Check
      `journalctl -u caddy` for a bind or certificate error.
    quiet: true
  when:
    - not ansible_check_mode
    - caddy_https_listener is not skipped
