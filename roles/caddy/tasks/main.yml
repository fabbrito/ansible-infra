---
# ADR-0008: resolve the two route lists once, before anything reads them. Every
# task and the template read caddy_all_routes and only that — a security
# boundary: a `caddy_routes | selectattr('proxied_by', 'defined')` that forgets
# caddy_extra_routes renders NO trust block for a proxied route, with no error
# and no diff.
- name: Resolve the effective route list
  ansible.builtin.set_fact:
    caddy_all_routes: "{{ caddy_routes + caddy_extra_routes }}"

# The schema cannot make these unrepresentable, so they fail the converge instead.
- name: Assert every route declares a TLS mode
  ansible.builtin.assert:
    that:
      - item.tls is defined
      - item.tls in ['acme', 'cert']
    fail_msg: >-
      Route {{ item.host }} needs `tls: acme` or `tls: cert`.
    quiet: true
  loop: "{{ caddy_all_routes }}"
  loop_control:
    label: "{{ item.host }}"
  # No default may replace this: the template once emitted
  # `tls <certs>/default.pem` unconditionally, at a file no ACME host writes, and
  # an ACME-only host could not converge at all.

- name: Assert an ACME account email is set when any route uses ACME
  ansible.builtin.assert:
    that:
      - caddy_acme_email is defined
      - caddy_acme_email | length > 0
    fail_msg: >-
      Routes use `tls: acme` but caddy_acme_email is unset. Set it fleet-wide;
      it is an address, not a credential, so it needs no vault.
    quiet: true
  when: caddy_all_routes | selectattr('tls', 'equalto', 'acme') | list | length > 0
  # ADR-0006: the email is what admits ZeroSSL as a fallback issuer. Absent,
  # Caddy's chain silently shrinks to Let's Encrypt alone.

- name: Assert at most one proxy provider fronts this host
  ansible.builtin.assert:
    that:
      - caddy_all_routes | selectattr('proxied_by', 'defined')
        | map(attribute='proxied_by') | unique | list | length <= 1
    fail_msg: >-
      Routes name more than one `proxied_by` provider. Trust is server-level in
      Caddy and every vhost shares :443, so one host can trust one provider.
    quiet: true
  # The ranges could union; `client_ip_headers` could not — two providers on one
  # host is unrepresentable in Caddy.

# The third schema constraint, unasserted above because it cannot be:
# `upstreams[].paths` must stay LITERAL strings. Ansible renders a var before the
# role sees it, so `/api/{{ version }}/*` arrives as `/api/v1/*` and the assert
# passes every time. The check must read the inventory YAML raw, which puts it in
# the consuming repo's CI, not in this role. Cost of getting it wrong:
# defaults/main.yml, by the field.
- name: Caddy apt key
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://dl.cloudsmith.io/public/caddy/stable/gpg.key \
      | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
    executable: /bin/bash

# Remove legacy .list from the old apt_repository module — deb822 writes
# caddy.sources; a lingering caddy.list would be a duplicate-repo source.
- name: Remove legacy Caddy apt .list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/caddy.list
    state: absent

- name: Caddy apt repo
  ansible.builtin.deb822_repository:
    name: caddy
    types: deb
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: any-version
    components: main
    signed_by: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
    state: present

# The distro package is what Caddy recommends for production
# (https://caddyserver.com/docs/install).
#   * Never run `caddy upgrade`: it self-replaces the binary in place and the
#     next dist-upgrade clobbers it. Upgrades ride apt. unattended-upgrades
#     allows only the Ubuntu security origins (see `os`), not Caddy's Cloudsmith
#     — so the replaced binary survives until an operator next runs
#     playbooks/update.yml, which is what makes the clobber a surprise.
#   * Standard modules only. A third-party plugin (DNS-challenge, WAF) means
#     leaving apt for an xcaddy build.
# The package starts + enables the `caddy` unit; the service task below guards
# against a hand-disable, it does not bring caddy up.
- name: Install caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Ensure certs dir
  ansible.builtin.file:
    path: "{{ caddy_certs_dir }}"
    state: directory
    owner: root
    group: caddy
    mode: "0750"

# --- Default cert (one CF zone — covers most hosts) ---
- name: Drop default origin certificate
  ansible.builtin.copy:
    dest: "{{ caddy_certs_dir }}/default.pem"
    content: "{{ caddy_origin_cert }}"
    owner: root
    group: caddy
    mode: "0640"
  when: caddy_origin_cert is defined and caddy_origin_cert | length > 0
  notify: Reload caddy

- name: Drop default origin private key
  ansible.builtin.copy:
    dest: "{{ caddy_certs_dir }}/default.key"
    content: "{{ caddy_origin_key }}"
    owner: root
    group: caddy
    mode: "0640"
  when: caddy_origin_key is defined and caddy_origin_key | length > 0
  no_log: true
  notify: Reload caddy

# --- Extra certs (multi-zone hosts only — caddy_extra_certs in host_vars) ---
- name: Drop extra origin certificates
  ansible.builtin.copy:
    dest: "{{ caddy_certs_dir }}/{{ item.name }}.pem"
    content: "{{ item.cert }}"
    owner: root
    group: caddy
    mode: "0640"
  loop: "{{ caddy_extra_certs }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.cert | default('') | length > 0
  notify: Reload caddy

- name: Drop extra origin private keys
  ansible.builtin.copy:
    dest: "{{ caddy_certs_dir }}/{{ item.name }}.key"
    content: "{{ item.key }}"
    owner: root
    group: caddy
    mode: "0640"
  loop: "{{ caddy_extra_certs }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.key | default('') | length > 0
  no_log: true
  notify: Reload caddy

# The next task's `validate:` runs `caddy validate` as root, which Provision()'s
# the file logger and creates a missing log file root-owned — runtime Caddy (uid
# caddy) then can't write it, causing endless reload-timeout loops. Pre-creating
# them caddy-owned makes validate a no-op.
- name: Ensure per-vhost access log files exist (caddy-owned)
  ansible.builtin.file:
    path: "/var/log/caddy/{{ item.host }}.log"
    state: touch
    owner: caddy
    group: caddy
    mode: "0640"
    access_time: preserve
    modification_time: preserve
  loop: "{{ caddy_all_routes }}"
  loop_control:
    label: "{{ item.host }}"
  changed_when: false

- name: Render Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0644"
    validate: "caddy validate --config %s --adapter caddyfile"
  notify: Reload caddy

- name: Ensure caddy is enabled and running
  ansible.builtin.service:
    name: caddy
    state: started
    enabled: true
  when: not ansible_check_mode
