---
# Everything reads caddy_all_routes, never caddy_routes: a filter that forgets
# the extras drops a proxied route's trust block silently (ADR-0008).
# Own file so the golden harness includes it rather than restating it.
- name: Resolve the effective route list
  ansible.builtin.set_fact:
    caddy_all_routes: "{{ caddy_routes + caddy_extra_routes }}"
