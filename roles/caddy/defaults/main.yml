---
# One entry per vhost:
#
#   caddy_routes:
#     - host: app.example.org          # bare hostname; `http://` disables ACME
#       tls: acme                      # acme | cert — required
#       proxied_by: cloudflare         # optional; a key of caddy_proxy_ranges
#       default_upstream: 127.0.0.1:3000   # catch-all; or redirect_to (301)
#       upstreams:                     # optional; matched before the catch-all
#         - { paths: [/api, /api/*, /webhooks/*], to: 127.0.0.1:3000 }
#       max_body_paths:                # optional; overrides caddy_max_body
#         - { paths: [/api/v1/*], max: 25MiB }
#       cert: other                    # optional; a caddy_extra_certs name
#
# `tls` and `proxied_by` stay two fields: a proxied name can still answer
# HTTP-01, and fusing them drops the trust block for that case (ADR-0005,
# ADR-0008). The catch-all is a named field so two or zero are unrepresentable.
#
# `paths` is the whole safety property once another upstream owns the
# catch-all: a missed public prefix (webhooks, signed links, health) gets the
# wrong app's 200. `/api/*` does not match `/api`; list both. Paths must be
# LITERAL — Ansible renders Jinja before the role sees it, so only the
# consuming repo, reading its YAML raw, can check this.
caddy_routes: []

# Appended to caddy_routes. Ansible does not merge vars, so this is the
# host_vars append-point for a group that computes caddy_routes.
caddy_extra_routes: []

# Host-wide body cap; Caddy has none by default. Units are SI (`25MB` is
# 25,000,000): write the binary unit, matching the app's own cap.
# Renders on a negated matcher: request_body limits compose and the smallest
# wins, so a bare default would clamp every per-path override.
caddy_max_body: 1MB

# Prefixes whose next path segment is a credential, redacted on both loggers
# (ADR-0009). A list, not a raw regex: a second `regexp` filter on one field
# silently replaces the first, and Caddy validates neither prefixes nor fields.
caddy_redact_uri_prefixes: []

# Who may front a route, keyed by provider; `proxied_by` selects one. Renders
# the server-level trust block (ADR-0008).
caddy_proxy_ranges:
  cloudflare:
    # Not X-Forwarded-For: client-appendable (ADR-0008).
    client_ip_headers: [CF-Connecting-IP]
    # https://www.cloudflare.com/ips/, in published order. Refresh on change.
    ranges:
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 108.162.192.0/18
      - 131.0.72.0/22
      - 141.101.64.0/18
      - 162.158.0.0/15
      - 172.64.0.0/13
      - 173.245.48.0/20
      - 188.114.96.0/20
      - 190.93.240.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32

# Required once any route uses ACME (asserted). It admits ZeroSSL as fallback
# issuer; absent, the chain is Let's Encrypt alone (ADR-0006). An address, not
# a secret.
caddy_acme_email: ""

# ACME directory override, for one staging run only (`-e`). Any value pins the
# CA and drops the fallback (ADR-0006); persisted, it serves an untrusted cert.
caddy_acme_ca: ""

# Cloudflare origin cert for `tls: cert` routes naming no `cert:` — set
# caddy_origin_cert + caddy_origin_key (vaulted), group-level: one wildcard
# per zone. Extra zones go per host in caddy_extra_certs; both halves of
# whatever a route names are asserted.
#   caddy_extra_certs:
#     - { name: other, cert: "{{ cert_zone_other }}", key: "{{ cert_zone_other_key }}" }
caddy_extra_certs: []

caddy_certs_dir: /etc/caddy/certs
