---
# Before the install touches the host.
- name: Check the rclone secrets
  ansible.builtin.include_tasks: secrets.yml

# The userland arch, not the kernel's: apt installs for the userland.
- name: Read the userland architecture
  ansible.builtin.command: dpkg --print-architecture
  register: rclone_dpkg_arch
  changed_when: false
  check_mode: false

- name: Assert a pinned .deb exists for the architecture
  ansible.builtin.assert:
    that: rclone_dpkg_arch.stdout in rclone_debs
    fail_msg: >-
      No pinned rclone .deb for {{ rclone_dpkg_arch.stdout }}; rclone_debs covers
      {{ rclone_debs.keys() | list | join(', ') }}.
    quiet: true

- name: Name the pinned .deb
  ansible.builtin.set_fact:
    rclone_deb: "{{ rclone_debs[rclone_dpkg_arch.stdout] }}"
    rclone_deb_path: "/var/cache/rclone-{{ rclone_version }}-{{ rclone_debs[rclone_dpkg_arch.stdout].asset }}.deb"

# The committed hash is the trust anchor; the host needs no gpg key. /var/cache
# survives a reboot, so a later converge downloads nothing.
- name: Download the pinned rclone .deb
  ansible.builtin.get_url:
    url: "https://downloads.rclone.org/{{ rclone_version }}/rclone-{{ rclone_version }}-{{ rclone_deb.asset }}.deb"
    checksum: "sha256:{{ rclone_deb.sha256 }}"
    dest: "{{ rclone_deb_path }}"
    owner: root
    group: root
    mode: "0644"

# Through dpkg so apt records the version and never swaps in the distro's 1.60.
# Skipped in check mode, where the download above did not happen.
- name: Install rclone from the pinned .deb
  ansible.builtin.apt:
    deb: "{{ rclone_deb_path }}"
    lock_timeout: 600
  when: not ansible_check_mode

# Backups run as root, so the config lives in /root.
- name: Ensure the rclone config directory
  ansible.builtin.file:
    path: /root/.config/rclone
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render rclone.conf
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: /root/.config/rclone/rclone.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true

# Postconditions. Skipped in --check, where nothing landed.
- name: Read the installed rclone version
  ansible.builtin.command: rclone version
  register: rclone_version_out
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Stat rclone.conf
  ansible.builtin.stat:
    path: /root/.config/rclone/rclone.conf
  register: rclone_conf_stat
  when: not ansible_check_mode

- name: Assert the pinned rclone and a private rclone.conf
  ansible.builtin.assert:
    that:
      - rclone_version_out.stdout_lines[0] == 'rclone ' ~ rclone_version
      - rclone_conf_stat.stat.mode == '0600'
    fail_msg: >-
      Wanted rclone {{ rclone_version }} and rclone.conf mode 0600; read
      "{{ rclone_version_out.stdout_lines[0] }}" and mode
      {{ rclone_conf_stat.stat.mode | default('absent') }}.
    quiet: true
  when: not ansible_check_mode
