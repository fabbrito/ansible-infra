---
# Also included by tests/golden/steps/rclone.yml.
#
# Counted, never `is defined`: empty is this repo's absent, and `is defined`
# would render a keyless [r2crypt] for a pair the assert passed as unset.
- name: Count the rclone secrets set
  ansible.builtin.set_fact:
    rclone_r2_set_count: >-
      {{ [rclone_r2_access_key_id | default(''),
          rclone_r2_secret_access_key | default(''),
          rclone_r2_endpoint | default('')]
         | reject('equalto', '') | list | length }}
    rclone_crypt_set_count: >-
      {{ [rclone_crypt_password | default(''),
          rclone_crypt_password2 | default('')]
         | reject('equalto', '') | list | length }}
  no_log: true

- name: Assert the R2 credentials are set
  ansible.builtin.assert:
    that: rclone_r2_set_count | int == 3
    fail_msg: >-
      {{ rclone_r2_set_count }}/3 of rclone_r2_access_key_id,
      rclone_r2_secret_access_key, rclone_r2_endpoint are set. Vault all three,
      or leave rclone out of this host's role list.
    quiet: true

- name: Assert the crypt passwords are both or neither
  ansible.builtin.assert:
    that: rclone_crypt_set_count | int in [0, 2]
    fail_msg: >-
      {{ rclone_crypt_set_count }}/2 of rclone_crypt_password,
      rclone_crypt_password2 are set. One alone keys the remote differently and
      the backups cannot be read back.
    quiet: true

- name: Record whether the crypt wrapper renders
  ansible.builtin.set_fact:
    rclone_crypt_enabled: "{{ rclone_crypt_set_count | int == 2 }}"
