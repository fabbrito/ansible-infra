---
# Where the keyring package puts the key, so our bootstrap copy is the file it
# later replaces.
tailscale_keyring: /usr/share/keyrings/tailscale-archive-keyring.gpg

# Lazy: read from whichever tailnet probe ran last.
tailscale_backend_state: >-
  {{ (tailscale_status.stdout | default('{}', true) | from_json).BackendState
     | default('') }}
