---
# Firewall: open declared ingress + rate-limit SSH BEFORE the deny-default
# enable, so flipping the policy can never lock the host out.
- name: UFW allow declared ingress ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    comment: "declared ingress ({{ ufw_rule_tag }})"
  loop: "{{ ufw_allowed_ports }}"
  tags: [os, ufw]

- name: UFW rate-limit SSH (max 6 conns/30s/IP)
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp
    comment: "ssh rate-limit ({{ ufw_rule_tag }})"
  tags: [os, ufw]

- name: UFW enable (deny by default)
  community.general.ufw:
    state: enabled
    policy: deny
  tags: [os, ufw]
