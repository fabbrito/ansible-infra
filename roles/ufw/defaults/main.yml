---
# Ports opened to the world (tcp). SSH (22) is rate-limited separately by
# the role and must never be listed here.
ufw_allowed_ports: [80, 443]

# Stamped into every rule comment this role writes, so a hand-added rule stands
# out in `ufw status`. The default only says a converge wrote it; override with
# the consuming repo's name to say which one. Changing it rewrites every rule
# comment on the next converge — once, harmlessly.
ufw_rule_tag: ansible
