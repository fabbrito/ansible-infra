---
# Bans land as ufw rules; with ufw off they would be written and never enforced.
- name: Read the ufw status
  ansible.builtin.command: ufw status
  register: fail2ban_ufw_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert ufw is active
  ansible.builtin.assert:
    that: "'Status: active' in fail2ban_ufw_status.stdout_lines"
    fail_msg: >-
      fail2ban bans through ufw, and ufw is not active here. Run the firewall
      role before fail2ban.
    quiet: true
  when: not ansible_check_mode

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true

- name: Configure fail2ban
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/fail2ban/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: fail2ban.local.j2, dest: fail2ban.local }
    - { src: jail.local.j2, dest: jail.local }
    - { src: sshd.local.j2, dest: jail.d/sshd.local }
    - { src: recidive.local.j2, dest: jail.d/recidive.local }
  loop_control:
    label: "{{ item.dest }}"
  notify: Reload fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  # In --check apt installed nothing, so systemd lacks the unit.
  when: not ansible_check_mode

- name: Apply the pending fail2ban reload
  ansible.builtin.meta: flush_handlers

# A jail with a bad filter or backend is dropped at load, and the service still
# reports active. Skipped in --check, where nothing landed.
- name: Read the running jails
  ansible.builtin.command: fail2ban-client status
  register: fail2ban_status
  changed_when: false
  failed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Assert the sshd and recidive jails run
  ansible.builtin.assert:
    that:
      - fail2ban_status.rc == 0
      - "'sshd' in fail2ban_jails"
      - "'recidive' in fail2ban_jails"
    fail_msg: >-
      fail2ban-client status: {{ fail2ban_status.stdout_lines
      + fail2ban_status.stderr_lines }}. Check `journalctl -u fail2ban`.
    quiet: true
  vars:
    fail2ban_jails: >-
      {{ fail2ban_status.stdout.split('Jail list:')[-1] | split(',')
         | map('trim') | list }}
  when: not ansible_check_mode
