---
# The observability stack: Beszel (hub + agent) for metrics, Dozzle for logs —
# one compose project, loopback-bound, reached over `ssh -L` (docs/monitoring/access.md).
# We AUTHOR the compose; the images are upstream (henrygd/beszel, amir20/dozzle).
#
# ADR-0001 pairing gate: the agent's KEY+TOKEN are minted by the hub's one-time
# "Add System" UI step, unreachable before the hub runs. Hub + Dozzle need no
# secret and come up on the first converge; the agent is rendered — and thus
# started — only once its token is vaulted, so a box monitors nothing until you
# pair and re-converge.

# Not an ADR-0001 skip: without an admin identity the hub still starts and still
# serves, it just never creates a first user — and an admin-less Beszel hub is
# open. Fail the converge instead (ADR-0010).
- name: Assert the hub has an admin identity
  ansible.builtin.assert:
    that:
      - monitoring_admin_email | default('') | length > 0
      - monitoring_admin_password | default('') | length > 0
    fail_msg: >-
      A monitoring host needs monitoring_admin_email (group_vars) and
      monitoring_admin_password (group vault). Absent, the hub creates no first
      user and answers unauthenticated to anyone who reaches its port.
    quiet: true

- name: Record whether the agent is paired (its hub token exists)
  ansible.builtin.set_fact:
    monitoring_agent_paired: "{{ (monitoring_agent_token | default('')) | length > 0 }}"

# One-directional, NOT all-or-nothing like rclone's: key-without-token is the
# documented revoke (pull the token, the compose stops rendering the agent), so
# only the reverse is wrong. The hub mints both at once, so a token without its
# key means one of the pair was dropped in transit to the vault.
- name: Assert a paired agent also has the hub's public key
  ansible.builtin.assert:
    that: monitoring_agent_key | default('') | length > 0
    fail_msg: >-
      monitoring_agent_token is set but monitoring_agent_key is empty. The hub's
      one-time "Add System" step mints them together — the KEY authenticates
      nothing and belongs in plain group_vars, the TOKEN belongs in the group
      vault. Half the pair starts an agent that can never authenticate, on a
      converge that reports success.
    quiet: true
  when: monitoring_agent_paired

- name: Ensure the stack directory exists
  ansible.builtin.file:
    path: "{{ monitoring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# The two secrets only; the world-readable compose interpolates them rather than
# inlining. Non-secret config (URLs, admin email, agent public key) sits in the
# compose from role vars, where it stays reviewable.
- name: Render the .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ monitoring_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render the compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

# `state: present` reconciles the whole project: pull the agent's token and the
# compose drops it, so remove_orphans tears the running agent down.
# build: never — we run published tags, never build on the host.
# Check mode has no daemon: the baseline docker install did not really happen.
- name: Bring up the monitoring stack
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    pull: missing
    build: never
    remove_orphans: true
    state: present
  when: not ansible_check_mode
