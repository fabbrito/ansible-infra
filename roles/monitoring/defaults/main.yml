---
# infra_install_dir is a consumer contract var.
monitoring_dir: "{{ infra_install_dir }}/monitoring"

# Pinned, never `latest`. Match the registry tag, not the GitHub release:
# Beszel's carry no `v`, Dozzle's do.
monitoring_hub_version: "0.18.7" # henrygd/beszel
monitoring_agent_version: "0.18.7" # henrygd/beszel-agent
monitoring_dozzle_version: v10.6.11 # amir20/dozzle

# LOOPBACK ONLY: Docker's published ports bypass ufw, and Dozzle has no auth.
# Reach them over `ssh -L` (docs/monitoring/access.md); anything put in front
# must supply the auth.
monitoring_hub_bind: "127.0.0.1"
monitoring_hub_port: 9090
monitoring_dozzle_bind: "127.0.0.1"
monitoring_dozzle_port: 9080

# Only feeds links in the hub's notifications; tunnelled, localhost is right.
monitoring_app_url: "http://localhost:{{ monitoring_hub_port }}"

# Required, with monitoring_admin_password (vaulted): without them the hub
# never creates a first user and serves unauthenticated. Applied only while no
# user exists, so re-rendering is idempotent. Prefer a team mailbox.
monitoring_admin_email: ""

# Agent pairing, an opt-in feature keyed on monitoring_agent_token (vaulted;
# ADR-0015): both are minted by the hub's "Add System" step
# (docs/monitoring/access.md), so the first converge has neither. The key is
# public. A token without the key is asserted; a key without the token is the
# revoke.
monitoring_agent_key: ""
