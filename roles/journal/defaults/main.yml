---
# `volume`: bind-mounted onto the storage volume at storage_path (contract var,
# README), asserted mounted. `root`: the root disk, for a host with no volume;
# removes a previous bind mount. Named, never inferred from an unset
# storage_path (ADR-0020).
journal_location: volume

# Volume mode only: the directory under storage_path the journal lives in.
journal_dir: journal
