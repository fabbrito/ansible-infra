---
# Added to the docker group. Must already exist (asserted).
docker_users:
  - "{{ deploy_user }}"

# Opt-in ghcr.io login: set ghcr_pull_token (vaulted) and ghcr_login_username.
# Unset, plain Docker. Consumer contract vars, so unprefixed and undefaulted.

# Weekly prune: stopped containers, unused networks, images older than
# docker_cleanup_until — never volumes. The hour must clear every backup window,
# smear included: ours derives Sun 05:00, so re-derive it when a backup timer
# moves.
docker_cleanup_until: 168h
docker_cleanup_oncalendar: "Sun *-*-* 05:00:00"
docker_cleanup_randomized_delay: 30m
