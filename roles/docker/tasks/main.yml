---
# The userland arch, not the kernel's: they differ on a 64-bit Pi kernel with
# a 32-bit userland, and apt installs for the userland.
- name: Read the userland architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_dpkg_arch
  changed_when: false
  check_mode: false

- name: Assert a platform Docker publishes for
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - docker_dpkg_arch.stdout in ['amd64', 'arm64', 'armhf']
    fail_msg: >-
      Docker's apt repo covers Debian-family amd64/arm64/armhf; this host is
      {{ ansible_facts['distribution'] }} {{ docker_dpkg_arch.stdout }}.
      Leave docker out of this host's role list.
    quiet: true

# Opt-in feature keyed on its token (ADR-0015).
- name: Assert the GHCR login is complete when requested
  ansible.builtin.assert:
    that: >-
      ghcr_pull_token | default('') | length == 0
      or ghcr_login_username | default('') | length > 0
    fail_msg: >-
      ghcr_pull_token is set but ghcr_login_username is not — the login needs
      both. Set the username beside the token, or unset the token for plain
      Docker.
    quiet: true

# The user module would silently create a missing account, keyless.
- name: Read the accounts docker_users names
  ansible.builtin.getent:
    database: passwd
  check_mode: false

- name: Assert every docker_users account exists
  ansible.builtin.assert:
    that: docker_users | difference(ansible_facts['getent_passwd'].keys()) | length == 0
    fail_msg: >-
      docker_users names accounts this host lacks:
      {{ docker_users | difference(ansible_facts['getent_passwd'].keys()) | join(', ') }}.
      Run bootstrap first, or drop them from docker_users.
    quiet: true

# Pinned: a rotated key fails here, loudly, not later inside apt.
- name: Download the Docker signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_url }}/gpg"
    checksum: "sha256:{{ docker_apt_key_sha256 }}"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

# Left by earlier releases: a .list duplicating the repo, a dearmored key
# nothing signs with.
- name: Remove the legacy Docker apt source and key
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/keyrings/docker.gpg

- name: Add the Docker repo
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
  register: docker_apt_source

# In check mode on a fresh host the repo was never added, so apt knows no
# docker-ce to plan, and no docker group exists for the task after.
- name: Install Docker engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  when: not (ansible_check_mode and docker_apt_source is changed)

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  when: not (ansible_check_mode and docker_apt_source is changed)

# apt's postinst starts the daemon, not a task here, so nothing above proves it.
- name: Probe the Docker daemon
  # Exits non-zero when the client cannot reach the server.
  ansible.builtin.command: docker version
  register: docker_server_version
  changed_when: false
  failed_when: false
  # In --check the engine above isn't really installed.
  when: not ansible_check_mode

- name: Assert the Docker daemon answers
  ansible.builtin.assert:
    that: docker_server_version.rc == 0
    fail_msg: >-
      docker is installed but the daemon does not answer:
      {{ docker_server_version.stderr | default('') }}.
      Check `systemctl status docker` on the host.
    quiet: true
  when: not ansible_check_mode

- name: Login to GHCR (if ghcr_pull_token is set)
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ ghcr_login_username }}"
    password: "{{ ghcr_pull_token }}"
  # In --check the engine above isn't really installed.
  when:
    - not ansible_check_mode
    - ghcr_pull_token | default('') | length > 0
  no_log: true

- name: Install docker cleanup timer
  ansible.builtin.include_tasks: install-cleanup-timer.yml
