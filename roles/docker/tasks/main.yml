---
- name: Add Docker apt key
  ansible.builtin.shell: |
    set -o pipefail
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
      | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg
    executable: /bin/bash

# Remove legacy .list from the old apt_repository module — deb822 writes
# docker.sources; a lingering docker.list would be a duplicate-repo source.
- name: Remove legacy Docker apt .list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Add Docker apt repo
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    signed_by: /etc/apt/keyrings/docker.gpg
    state: present

- name: Install Docker engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Login to GHCR (if ghcr_pull_token is set)
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ ghcr_login_username }}"
    password: "{{ ghcr_pull_token }}"
  # In --check the engine above isn't really installed — login hits a missing daemon.
  when:
    - not ansible_check_mode
    - ghcr_pull_token is defined
    - ghcr_pull_token | length > 0
  no_log: true

- name: Install docker cleanup timer
  ansible.builtin.include_tasks: install-cleanup-timer.yml
