---
# Floor: community.general 13.x needs it and the roles call
# ansible.builtin.systemd_service (aliased in 2.18), so an older core fails at
# install with a version error instead of an obscure module failure.
# No ceiling, deliberately: one blocks every consumer who upgrades core until we
# cut a release, to guard an incompatibility we have not seen. A core 3.x is then
# a converge failure the consumer's dry-run catches. scripts/lint.sh repeats this
# literal; move both together.
requires_ansible: ">=2.18.0"
