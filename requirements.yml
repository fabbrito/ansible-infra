# Development-time install for linting this repo. galaxy.yml's `dependencies:` is
# the SHIPPED truth; the two lists must agree — change both or neither. The core
# floor is meta/runtime.yml's, and scripts/lint.sh enforces it.
collections:
  # Bump bounds explicitly when adopting a new major: a deprecation should surface
  # as a chosen upgrade, not silent drift.
  - name: community.docker
    version: ">=5.0.0,<6.0.0" # `docker_compose_v2` arrived in 5.x; v4 removed the legacy module
  - name: community.general
    version: ">=13.0.0,<14.0.0"
  - name: ansible.posix
    version: ">=2.0.0,<3.0.0"
