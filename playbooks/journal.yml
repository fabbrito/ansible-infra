---
# A persistent journal: on a storage volume, which needs `storage_path`
# (README), or on the root disk with `journal_location: root`.
#
#   - import_playbook: fabbrito.infra.journal
#
# Scope a run with -l.
- name: Journal
  hosts: all
  become: true
  gather_facts: false
  roles:
    - fabbrito.infra.journal
