---
# The baseline every host gets, whatever it later runs. A consuming repo imports
# this and appends its own group-scoped service plays:
#
#   - import_playbook: capybaralabs.infra.baseline
#
#   - name: My service
#     hosts: my_service_hosts
#     become: true
#     roles:
#       - { role: my_service, tags: [my_service] }
#
# `hosts: all` is deliberate — the baseline is not opt-in. Scope a run with
# `-l <host>`, not by narrowing this play.
#
# Role order is load-bearing. os swaps before the apt upgrade that would OOM
# without it; ufw opens declared ingress before it flips to deny-default.
# Reorder either and a converge can lock us out (ADR-0002).
- name: Baseline (every host)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - { role: capybaralabs.infra.os, tags: [os] }
    - { role: capybaralabs.infra.ufw, tags: [os, ufw] }
    # Baseline, not a service — every host wants SSH brute-force protection.
    # After ufw: its banaction is `ufw`.
    - { role: capybaralabs.infra.fail2ban, tags: [os, fail2ban] }
    - { role: capybaralabs.infra.docker, tags: [base, docker] }
    - { role: capybaralabs.infra.rclone, tags: [base, rclone] }
