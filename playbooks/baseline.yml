---
# The baseline every host gets, whatever it later runs. A consuming repo imports
# this and appends its own group-scoped service plays:
#
#   - import_playbook: fabbrito.infra.baseline
#
#   - name: My service
#     hosts: my_service_hosts
#     become: true
#     roles:
#       - { role: my_service, tags: [my_service] }
#
# `hosts: all` is deliberate — the baseline is not opt-in. Scope a run with
# `-l <host>`, not by narrowing this play.
#
# Role order is load-bearing: firewall reads the ports from the effective sshd
# config, so sshd runs first (ADR-0002).
- name: Baseline (every host)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - { role: fabbrito.infra.os, tags: [os] }
    - { role: fabbrito.infra.sshd, tags: [os, ssh] }
    - { role: fabbrito.infra.firewall, tags: [os, firewall] }
    # After firewall: its banaction is `ufw`.
    - { role: fabbrito.infra.fail2ban, tags: [os, fail2ban] }
    - { role: fabbrito.infra.docker, tags: [base, docker] }
    - { role: fabbrito.infra.rclone, tags: [base, rclone] }
