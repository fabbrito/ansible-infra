---
# Run once per fresh host, as root, to create the account every other play
# connects as. The seed does this on first boot; this is for hosts it missed.
#
#   ansible-playbook fabbrito.infra.bootstrap -e target=<host>
#
# Without -e target= the pattern matches no host, never the fleet.
- name: Bootstrap deploy user
  hosts: "{{ target | default('bootstrap_target_unspecified') }}"
  serial: 1
  remote_user: root
  become: true
  gather_facts: false
  vars:
    # A play var, so the inventory's ansible_user (not yet created) loses.
    # Never deploy_user: it would beat group_vars and strand the host.
    ansible_user: root
  tasks:
    # Before anything is created: an empty key list would still grant sudo to
    # an account nobody can reach (ADR-0015).
    - name: Assert the deploy account
      ansible.builtin.assert:
        that:
          - deploy_user | default('') is match('^[a-z][-a-z0-9_]*$')
          - deploy_user != 'root'
          - deploy_authorized_keys | default('') is sequence
          - deploy_authorized_keys is not string
          - deploy_authorized_keys | length > 0
        fail_msg: >-
          deploy_user must name a non-root account and deploy_authorized_keys be
          a non-empty list: the keys are the only way into the account this play
          grants passwordless sudo.
        quiet: true

    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        create_home: true
        state: present

    - name: Install deploy authorized keys
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ item }}"
        state: present
      loop: "{{ deploy_authorized_keys }}"

    - name: Grant deploy passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-deploy
        content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s
