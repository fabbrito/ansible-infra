---
# The tailnet, for the hosts in the consumer's `tailscale` group. Joins when
# tailscale_auth_key is vaulted; unset, the operator joins by hand.
#
#   - import_playbook: fabbrito.infra.tailscale
#
# Scope a run with -l.
- name: Tailscale
  hosts: tailscale
  become: true
  gather_facts: true
  roles:
    - fabbrito.infra.tailscale
