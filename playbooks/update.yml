---
# OS-level updates (apt). Serial so the fleet never reboots all at once.
#
#   ansible-playbook capybaralabs.infra.update -l <host-or-group>
- name: System updates
  hosts: "{{ target | default('all') }}"
  become: true
  serial: 1
  gather_facts: false

  tasks:
    - name: Apt update + dist-upgrade + autoremove
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        autoclean: true
        # Overrides os_apt_cache_valid_time: an upgrade wants a fresh cache, not
        # whatever a converge left behind within the hour.
        cache_valid_time: 0

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if needed
      ansible.builtin.reboot:
        msg: "Reboot triggered by the update playbook"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 5
        post_reboot_delay: 30
        test_command: uptime
      when: reboot_required.stat.exists
