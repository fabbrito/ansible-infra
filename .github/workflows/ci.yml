name: CI

# The static gate, in two halves. `make check` is the fast one the pre-commit
# hook also runs: fmt-check, playbook syntax, ansible-lint at the production
# profile, shellcheck, collection build. `make sanity` is the slow one only CI
# runs. There is deliberately no vault step and no dry-run leg — this repo owns
# no inventory and reaches no host, so the `--check --diff` half belongs to the
# consuming repo (README.md, "Where the gate lives").
#
# The repo is public, so two of the three CI guards live in repo settings where
# this file cannot show them and `make check` cannot verify them: fork PRs are
# held for approval from every external contributor, and `actions/*` is the only
# action allowlisted. `pull_request` (never `pull_request_target`) is the third
# and the one in-tree — it keeps a fork's run secretless and its token
# read-only. All three, and what reverses them, are ADR-0012's.

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # prettier (npx), shfmt and shellcheck back `make check`. npx and
      # shellcheck are preinstalled on ubuntu-latest; shfmt is not.
      - name: Install ansible + lint toolchain
        run: pip install ansible-core ansible-lint

      # Version-pinned, not checksum-pinned. A tampered release would run
      # arbitrary code on the runner — which holds nothing: no secrets, a
      # read-only token, and no artifact leaves here. Add a `sha256sum -c`
      # the day this workflow gains a publish step.
      - name: Install shfmt
        env:
          SHFMT_VERSION: v3.13.1
        run: |
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt
          shfmt --version

      # Into .collections/, which scripts/lint.sh also stages this collection
      # into so fabbrito.infra.* resolves during the syntax check.
      - name: Install Ansible collections
        run: make deps

      - name: fmt-check + lint
        run: make check

      # Not in `make check`, because the pre-commit hook runs that on every
      # commit and a cold sanity venv is slow. CI is where it belongs.
      - name: ansible-test sanity
        run: make sanity

      # The leg that catches what neither ansible-lint nor `caddy validate`
      # will: a template change that renders a valid config saying the wrong
      # thing.
      - name: golden render tests
        run: make test

  # Tags only — there is nothing to grade on a branch. This is the one release
  # invariant a consumer cannot check for themselves: an installed tree records
  # no git ref, so a tag disagreeing with galaxy.yml reaches them as a stale
  # install they are told to fix by reinstalling, which never works.
  release:
    name: tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ansible
        run: pip install ansible-core

      - name: Assert the tag matches galaxy.yml
        run: make tag-check TAG="${GITHUB_REF_NAME}"
