# The whole hook policy. Engine vendored from fabbrito/githooks v0.3.1,
# named here only; bump by copying a newer tag over it.
schema = 1

types       = feat fix refactor chore style docs build perf test
subject_max = 72
bullet_max  = 2
body_cols   = 80

# Cross-cutting names, then one scope per role and per docs topic.
scope_fixed = repo docs deps release build tests hooks make galaxy readme context changelog golden sanity playbooks
scope_root  = roles/*/
scope_root  = docs/*/

trailer_person    = Co-Authored-By Signed-off-by Reviewed-by
trailer_reference = Refs Closes Fixes

# require everywhere: a skipped lane is not a green commit.

# Every ansible command goes through lint.sh, which guards stdio once.
[group ansible]
match   = *.yml *.yaml *.j2 *.cfg .ansible-lint
scope   = tree
require = true
run     = scripts/lint.sh

# The vendored engine is upstream's to format.
[group shell]
match   = *.sh .githooks/commit-msg .githooks/pre-commit
scope   = staged
require = true
run     = shfmt -i 0 -ci -d
fix     = shfmt -i 0 -ci -w
run     = shellcheck -x

# Pinned, so an npm release cannot redden the tree. npx, not bunx: bun leaves
# stdio non-blocking.
[group docs]
match   = *.md *.json *.yml *.yaml
scope   = staged
require = true
run     = npx --yes prettier@3.9.8 --check
fix     = npx --yes prettier@3.9.8 --write

# A config change reformats the whole tree. The glob is prettier's: lane
# commands are exec'd, never shelled.
[group docs-config]
match   = .prettierrc.json .prettierignore
scope   = tree
require = true
run     = npx --yes prettier@3.9.8 --check **/*.{yml,yaml,md,json}
fix     = npx --yes prettier@3.9.8 --write **/*.{yml,yaml,md,json}
