# templates/base: copy to .config/mise/conf.d/base.toml. Hooks and make run
# these, never whatever apt left on PATH. A bump is a version here and
# `make hooks`.
[tools]
lefthook = "2.1.14"
# The grader is one bare, platform-free file: without asset_pattern, mise's
# platform matching finds no linux-x64 asset and refuses it.
"github:fabbrito/repokit" = { version = "0.1.1", asset_pattern = "commit-msg-lint" }
