# templates/base: copy to .config/lefthook/base.yml, first under `extends:`.
# commitlint, lefthook's settings, and a gate on each: `validate` refuses an
# unknown key that `lefthook run` ignores, make-phony a target left unphony.
min_version: "2.1"
glob_matcher: doublestar # `**/*.sh` matches the root too
rc: .config/lefthook-rc.sh # mise's tools on PATH, or the hook fails

commit-msg:
  jobs:
    - name: commitlint
      run: commitlint --strict -g .config/commitlint.config.mjs --edit {1}

pre-commit:
  jobs:
    - name: lefthook-validate
      glob: ["lefthook.yml", "lefthook-local.yml", ".config/lefthook/*.yml"]
      run: lefthook validate
    # Not handed paths: make reads every include, so the Makefile is one unit.
    - name: make-phony
      glob: ["Makefile", "**/*.mk"]
      run: .config/make-phony.sh
