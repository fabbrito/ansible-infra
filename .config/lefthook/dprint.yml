# templates/dprint: copy to .config/lefthook/dprint.yml, list it under
# `extends:`. dprint formats markdown, json, toml and yaml; its own dprint.json
# says which plugins and which files. --allow-no-files: dprint exits nonzero
# when every path it is handed is one of its own excludes.
#
# A change to dprint.json redefines "formatted" for the whole tree, so that
# job checks everything - and only checks on commit: stage_fixed re-stages
# staged paths only, so a whole-tree write would leave the rest unstaged.
pre-commit:
  jobs:
    - name: dprint
      glob: &format ["**/*.md", "**/*.json", "**/*.toml", "**/*.{yml,yaml}"]
      file_types: &file [not symlink]
      run: dprint fmt --allow-no-files {staged_files}
      stage_fixed: true
    - name: dprint-config
      glob: &config ["dprint.json"]
      run: dprint check --allow-no-files
