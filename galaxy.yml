---
# Installed from a git tag, never vendored. Began at 1.0.0: the README's var
# table was a contract from the first release.
namespace: fabbrito
name: infra
version: 2.0.0
readme: README.md

# No mailbox: MANIFEST.json is public. Issues, or the Security tab.
authors:
  - Fabrício Brito (@fabbrito)

description: >-
  Composable roles for long-lived Debian-family hosts, cloud VMs and boards —
  OS, SSH hardening, firewall, fail2ban, Docker, rclone/R2 backups, Caddy,
  monitoring, Tailscale, and a board's network and journal. Service roles stay
  in the consuming repo.

# Both: the SPDX id is what tools match, the file is the text that ships.
license:
  - Apache-2.0

license_file: LICENSE

tags:
  - infrastructure
  - linux
  - ubuntu
  - docker
  - caddy
  - firewall
  - backup

# Majors: a breaking release is a chosen upgrade, not drift.
dependencies:
  community.docker: ">=5.0.0,<6.0.0"
  community.general: ">=13.0.0,<14.0.0"
  ansible.posix: ">=2.0.0,<3.0.0"

repository: https://github.com/fabbrito/ansible-infra
documentation: https://github.com/fabbrito/ansible-infra/blob/master/README.md
homepage: https://github.com/fabbrito/ansible-infra
issues: https://github.com/fabbrito/ansible-infra/issues

# The build's ONLY exclusion list: .gitignore is not read. Authoring tools and
# rules stay out of a consumer's tree, where their agents would read them.
# build-check.sh fails on anything shipped outside its allowlist.
build_ignore:
  - .collections
  - .ansible
  - .tmp
  - .github
  - .githooks
  - .gitignore
  - .ansible-lint
  - .prettierignore
  - .prettierrc.json
  - AGENTS.md
  - CLAUDE.md
  # Both configure this repo's authoring, like AGENTS.md.
  - CONTEXT.md
  - docs/agents
  - Makefile
  - scripts
  - tests
