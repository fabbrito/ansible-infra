---
# What roles/journal/tasks/main.yml renders. The input asserts are the role's
# own file, so a refused fixture pins its message.
- name: Assert the journal inputs
  ansible.builtin.include_tasks: "{{ golden_repo }}/roles/journal/tasks/inputs.yml"

- name: Render the journal bind-mount unit
  ansible.builtin.template:
    src: "{{ golden_repo }}/roles/journal/templates/var-log-journal.mount.j2"
    dest: "{{ golden_case_out }}/var-log-journal.mount"
    mode: "0644"
  when: journal_location == 'volume'

- name: Render the persistent-storage drop-in
  ansible.builtin.template:
    src: "{{ golden_repo }}/roles/journal/templates/50-persistent.conf.j2"
    dest: "{{ golden_case_out }}/50-persistent.conf"
    mode: "0644"
