---
# The baseline, and the one fixture that exists for what it must NOT render: a host
# nobody fronts, no secret-bearing path — no `servers` trust block, no redaction
# filter, no `acme_ca`. ADR-0008's failure mode is a trust block where nothing fronts
# the host, invisible unless a fixture pins the empty case.
#
# Also the simplest shape of each per-route branch: ACME (no `tls` line), one
# catch-all upstream (no `handle` blocks), no per-path caps (the bare `request_body`,
# not the negated matcher).
caddy_acme_email: ops@example.org

caddy_routes:
  - host: app.example.org
    tls: acme
    default_upstream: 127.0.0.1:3000

caddy_extra_routes: []
