---
# The staging hatch, alone in a fixture because its whole risk is that it PERSISTS.
# ADR-0006 leaves the CA unpinned; naming one collapses the issuer chain to it and
# drops the ZeroSSL fallback, so a value surviving past its run serves a certificate
# no browser trusts, on a green converge.
#
# The golden's job is exact: `acme_ca` appears when this is set; every other fixture
# proves it absent when it is not.
caddy_acme_email: ops@example.org
caddy_acme_ca: https://acme-staging-v02.api.letsencrypt.org/directory

caddy_routes:
  - host: app.example.org
    tls: acme
    default_upstream: 127.0.0.1:3000

caddy_extra_routes: []
