---
# A box in the monitoring group, not yet paired — the first converge, before the hub
# mints anything. ADR-0015: hub and Dozzle come up, the agent renders NOWHERE, the
# converge is green.
#
# Fails if the pairing gate inverts: a `TOKEN=` line in the .env or a beszel-agent
# service in the compose means an agent that starts and never authenticates.
#
# monitoring_agent_token IS SET, EMPTY, ON PURPOSE — it has no role default (vaulted
# in the consumer), so nothing clears the value the `paired` fixture sets and this
# case would silently become a second copy of it.
monitoring_agent_token: ""

# The key without the token is the documented revoke and renders nothing on its own;
# set so this fixture covers that half too.
monitoring_agent_key: golden-fixture-not-a-key

monitoring_admin_email: ops@example.org
monitoring_admin_password: golden-fixture-not-a-password

infra_install_dir: /opt/infra
