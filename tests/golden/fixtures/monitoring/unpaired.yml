---
# A box that has joined the monitoring group but has not been paired yet — the
# first converge, before the hub exists to mint anything. ADR-0001: hub and
# Dozzle come up, the agent renders NOWHERE, and the converge is green.
#
# This is the fixture that fails if the pairing gate ever inverts. A `TOKEN=`
# line in the .env or a beszel-agent service in the compose here means an agent
# that starts and can never authenticate.
#
# monitoring_agent_token IS SET, TO EMPTY, ON PURPOSE. It has no role default —
# it is vaulted in the consuming repo — so nothing would clear the value the
# `paired` fixture sets, and this case would silently become a second copy of it.
monitoring_agent_token: ""

# The key without the token is the documented revoke, and it is fine: it renders
# nothing on its own. Set here so this fixture covers that half too.
monitoring_agent_key: golden-fixture-not-a-key

monitoring_admin_email: ops@example.org
monitoring_admin_password: golden-fixture-not-a-password

infra_install_dir: /opt/infra
